name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=agentguard --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: bandit -r src -s B101
      - run: python scripts/check_secrets.py
      - run: pip-audit --disable-pip --no-deps -r requirements-dev.lock
      - run: agentguard validate-scenarios
      - run: agentguard run --provider fake --output results/ci
      - run: agentguard run --mode baseline --provider fake --policy examples/policy.json --output results/ci-baseline
      - run: agentguard run --mode guarded --provider fake --policy examples/policy.json --output results/ci-guarded
      - run: agentguard run --mode guarded_oversight --provider fake --policy examples/policy.json --reviewer fake-allow --output results/ci-oversight
      - run: agentguard compare --baseline results/ci-baseline/run.json --candidate results/ci-guarded/run.json
      - run: agentguard compare --baseline results/ci-baseline/run.json --candidate results/ci-oversight/run.json
      - run: agentguard run --provider anthropic --model claude-haiku-4-5-20251001 --max-cost 1 --dry-run
